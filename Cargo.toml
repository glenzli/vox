[workspace]
members = ["crates/vox-core", "apps/vox-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
blake3 = "1.8.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
unicode_categories = "0.1.1"
uuid = { version = "1.23.2", features = ["serde", "std", "v7"] }
tokio = { version = "1.49.0", features = ["rt", "time"] }
infer-runtime-client = { git = "https://github.com/glenzli/infer-runtime.git", rev = "8dc48ce137428e6c11d5d50a3bf94c090be7f3b9" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
